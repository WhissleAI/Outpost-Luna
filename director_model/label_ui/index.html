<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn labeller</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --ink:#14171c; --muted:#5d6673; --line:#dde1e6; --acc:#2456d6; --ok:#1d7a46;
  --warn:#a35b00; --bad:#b3261e; --chip:#eef1f5; --sel:#e6edff; }
@media (prefers-color-scheme: dark) { :root { --bg:#111418; --panel:#191d23; --ink:#e7eaee; --muted:#9aa3ae;
  --line:#2a3039; --acc:#7aa2ff; --ok:#5fcf8f; --warn:#f0a94a; --bad:#ff8a80; --chip:#232831; --sel:#1f2a44; } }
* { box-sizing:border-box }
body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink) }
header { display:flex; gap:12px; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap }
header h1 { font-size:15px; margin:0 8px 0 0 }
header .stat { color:var(--muted) }
header select, header button { font:inherit }
main { display:grid; grid-template-columns:minmax(260px, 34%) 1fr; height:calc(100vh - 45px) }
#list { overflow:auto; border-right:1px solid var(--line); background:var(--panel) }
.row { padding:6px 12px; border-bottom:1px solid var(--line); cursor:pointer; display:grid; grid-template-columns:1fr auto; gap:4px }
.row.cur { background:var(--sel) }
.row .tx { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.row .meta { color:var(--muted); font-size:12px }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--line) }
.dot.done { background:var(--ok) } .dot.low { background:var(--warn) }
#detail { overflow:auto; padding:14px 18px 40px }
.heard { font-size:22px; margin:2px 0 6px } .private { color:var(--muted); font-style:italic }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 }
.chip { background:var(--chip); border-radius:6px; padding:2px 8px; font-size:12px }
.chip b { font-weight:600 }
.sig { background:transparent; border:1px solid var(--warn); color:var(--warn) }
.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; margin:10px 0 }
.box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px }
.box h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted) }
.say { margin:2px 0 } .kv { color:var(--muted) } .kv b { color:var(--ink); font-weight:600 }
form .acts { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px }
form .acts label { border:1px solid var(--line); border-radius:6px; padding:4px 9px; cursor:pointer; user-select:none }
form .acts input { position:absolute; opacity:0; pointer-events:none }
form .acts label:has(input:checked) { border-color:var(--acc); background:var(--sel); color:var(--acc); font-weight:600 }
form .acts kbd { color:var(--muted); margin-right:4px }
.f { display:grid; grid-template-columns:110px 1fr; gap:6px 10px; align-items:center; margin:6px 0 }
.f input[type=text], .f select { font:inherit; padding:5px 7px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); width:100% }
.f .hint { grid-column:2; color:var(--muted); font-size:12px; margin-top:-4px }
.cands { display:flex; flex-direction:column; gap:4px }
.cands label { display:flex; gap:6px; align-items:flex-start; cursor:pointer }
.bar { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap }
button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff }
button.primary kbd { color:inherit; background:transparent; border-color:rgba(255,255,255,.55) }
#msg { color:var(--muted) } #msg.err { color:var(--bad) }
.keys { color:var(--muted); font-size:12px; margin-top:16px }
.keys kbd, form kbd { font:11px ui-monospace, Menlo, monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; background:var(--chip) }
.hidden { display:none !important }
@media (max-width:760px) { main { grid-template-columns:1fr; height:auto } #list { max-height:30vh } .f { grid-template-columns:1fr } .f .hint { grid-column:1 } }
</style>
</head>
<body>
<header>
  <h1>Turn labeller</h1>
  <span class="stat" id="stat">loading…</span>
  <label>Show <select id="filter">
    <option value="all">all turns</option>
    <option value="todo">not labelled</option>
    <option value="low">weak label &lt; 0.6</option>
    <option value="sig">with a signal</option>
    <option value="test">held out</option>
  </select></label>
  <span class="stat" id="out"></span>
</header>
<main>
  <nav id="list" aria-label="Turns"></nav>
  <section id="detail" aria-live="polite"></section>
</main>
<template id="tpl">
  <div class="heard" data-k="heard"></div>
  <div class="chips" data-k="chips"></div>
  <audio data-k="audio" controls preload="none" class="hidden"></audio>
  <div class="grid">
    <div class="box"><h3>Perception</h3><div data-k="perc"></div></div>
    <div class="box"><h3>Engine decided</h3><div data-k="dec"></div></div>
    <div class="box"><h3>Engine said</h3><div data-k="said"></div></div>
  </div>
  <form class="box" data-k="form" autocomplete="off">
    <h3>Label</h3>
    <div class="acts" data-k="acts"></div>
    <div class="f" data-show="navigate"><label for="nav">Navigation</label><select id="nav" name="nav"></select>
      <label for="navarg">Argument</label><input type="text" id="navarg" name="nav_arg" placeholder="lesson / site / panel id (optional)">
    </div>
    <div class="f" data-show="command"><label for="cmd">Order slots</label><input type="text" id="cmd" name="cmd" placeholder="allocate to=heaters amount=percent:40">
      <span class="hint">type key=value …  · amount=kind:value · on=true/false</span></div>
    <div class="f"><label for="place">Place</label><input type="text" id="place" name="place" list="places" placeholder="places.json id (optional)"></div>
    <div class="f"><span>Reply line</span><div class="cands" data-k="cands"></div></div>
    <div class="f"><label for="test">Held out</label><label><input type="checkbox" id="test" name="test"> test split (never trained on)</label></div>
    <div class="bar"><button type="submit" class="primary">Save &amp; next <kbd>Enter</kbd></button>
      <button type="button" data-k="skip">Skip turn <kbd>x</kbd></button><span id="msg" role="status"></span></div>
  </form>
  <p class="keys"><kbd>j</kbd>/<kbd>k</kbd> next / previous · <kbd>u</kbd> next not labelled · <kbd>1</kbd>–<kbd>8</kbd> act ·
    <kbd>a</kbd> play audio · <kbd>n</kbd> navigation · <kbd>o</kbd> order slots · <kbd>p</kbd> place ·
    <kbd>r</kbd> next reply candidate · <kbd>q</kbd> should stay quiet · <kbd>t</kbd> held out · <kbd>Enter</kbd> save &amp; next · <kbd>Esc</kbd> leave a field</p>
</template>
<datalist id="places"></datalist>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ACT_KEYS = ["ignore", "answer", "command", "navigate", "ask_clarify", "nudge", "confirm_yes", "confirm_no"];
let META = null, TURNS = [], VIEW = [], cur = 0, form = null;

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Label-UI": "1" }, body: JSON.stringify(body) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
function filtered() {
  const f = $("#filter").value;
  return TURNS.filter(t => !t.private && (f === "all" || (f === "todo" && !t.label) || (f === "low" && t.weak.conf < 0.6)
    || (f === "sig" && t.signals.length) || (f === "test" && t.label && t.label.split === "test")));
}
function stat() {
  const usable = TURNS.filter(t => !t.private), done = usable.filter(t => t.label).length;
  $("#stat").textContent = `${done} / ${usable.length} labelled · ${TURNS.length - usable.length} private · ${usable.filter(t => t.label && t.label.split === "test").length} held out`;
}
function drawList() {
  VIEW = filtered();
  if (cur >= VIEW.length) cur = Math.max(0, VIEW.length - 1);
  $("#list").innerHTML = VIEW.map((t, i) => `<div class="row${i === cur ? " cur" : ""}" data-i="${i}">
    <span class="tx"><span class="dot ${t.label ? "done" : t.weak.conf < 0.6 ? "low" : ""}"></span>${esc(t.text)}</span>
    <span class="meta">${esc(t.label ? t.label.fix : t.weak.act || "")}</span>
    <span class="meta">${esc(t.frame.screen || "")}${t.frame.step_type ? " · " + esc(t.frame.step_type) : ""}${t.audio ? " · ♪" : ""}</span>
    <span class="meta">${t.signals.map(s => esc(s.sig)).join(" ")}</span></div>`).join("") || `<p style="padding:12px">Nothing to show.</p>`;
  const el = $("#list .cur"); if (el) el.scrollIntoView({ block: "nearest" });
  stat();
}
const kv = (k, v) => v === undefined || v === null || v === "" ? "" : `<div class="kv">${esc(k)}: <b>${esc(typeof v === "object" ? JSON.stringify(v) : v)}</b></div>`;
function drawDetail() {
  const t = VIEW[cur], d = $("#detail");
  if (!t) { d.innerHTML = "<p>No turns.</p>"; return; }
  d.innerHTML = ""; d.append($("#tpl").content.cloneNode(true));
  const q = k => d.querySelector(`[data-k="${k}"]`);
  q("heard").textContent = t.text;
  const fr = t.frame;
  q("chips").innerHTML = [["screen", fr.screen], ["step", fr.step_type], ["lesson", fr.lesson_id && `${fr.lesson_id} #${fr.step}`],
    ["offer", fr.offer], ["mode", t.mode], ["course", t.course], ["source", t.src], ["class", t.cls],
    ["weak", `${t.weak.act || "?"} ${t.weak.conf}`], ["split", t.label && t.label.split === "test" ? "test (held out)" : t.split]]
    .filter(x => x[1]).map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join("")
    + t.signals.map(s => `<span class="chip sig">${esc(s.sig)}${s.dt != null ? " +" + esc(s.dt) + "s" : ""}</span>`).join("");
  if (t.audio) { const a = q("audio"); a.src = `/api/audio/${t.id}`; a.classList.remove("hidden"); }
  q("perc").innerHTML = kv("device-directed", t.arc.dd) + kv("command complete", t.arc.cc) + kv("dialogue act", (t.arc.act || []).join(", "))
    + Object.entries(t.ear).map(([k, v]) => kv(k, v)).join("") + (fr.options && fr.options.length ? kv("options", fr.options.join(" | ")) : "");
  if (!q("perc").innerHTML) q("perc").innerHTML = `<p class="kv">${t.src === "typed" ? "Typed: no ear read-out." : "No read-out."}</p>`;
  q("dec").innerHTML = kv("router", `${t.router.outcome || ""}${t.router.reason ? " (" + t.router.reason + ")" : ""}`) + kv("intent", t.router.intent)
    + kv("rules", t.director.rules) + kv("model", t.director.model && `${t.director.model} p=${t.director.p ?? "?"}`) + kv("override", t.director.override)
    + kv("final", t.director.final) + kv("source", t.director.source) + kv("order", t.cmd) + kv("why (weak)", t.weak.why);
  q("said").innerHTML = (t.reply.length ? t.reply.map(s => `<p class="say">“${esc(s)}”</p>`).join("") : `<p class="kv">Nothing said.</p>`)
    + kv("navigation", t.reply_nav && t.reply_nav.intent && `${t.reply_nav.intent}${t.reply_nav.arg ? " → " + t.reply_nav.arg : ""}`) + kv("place", t.place);
  form = q("form");
  const st = t.start;
  q("acts").innerHTML = ACT_KEYS.map((a, i) => `<label><input type="radio" name="act" value="${a}" ${st.act === a ? "checked" : ""}><kbd>${i + 1}</kbd>${esc(a.replace("_", " "))}</label>`).join("");
  form.nav.innerHTML = `<option value="">(which?)</option>` + META.nav.map(n => `<option ${n === st.nav ? "selected" : ""}>${esc(n)}</option>`).join("");
  form.nav_arg.value = st.nav_arg; form.cmd.value = st.cmd; form.place.value = st.place; form.test.checked = !!st.test;
  const cands = [...t.candidates, ""];
  if (st.reply && !cands.includes(st.reply)) cands.unshift(st.reply);
  q("cands").innerHTML = cands.map((c, i) => `<label><input type="radio" name="reply" value="${esc(c)}" ${c === st.reply ? "checked" : ""}>${c ? esc(c) : "<i>(stay quiet)</i>"}</label>`).join("")
    + `<label><input type="radio" name="reply" value="__other"><input type="text" name="reply_other" placeholder="another line…" style="flex:1"></label>`;
  form.reply_other.addEventListener("input", () => { form.querySelector('input[value="__other"]').checked = true; });
  const showSlots = () => { const a = (form.querySelector("input[name=act]:checked") || {}).value; form.querySelectorAll("[data-show]").forEach(el => el.classList.toggle("hidden", el.dataset.show !== a)); };
  form.addEventListener("change", showSlots); showSlots();
  form.addEventListener("submit", e => { e.preventDefault(); save(); });
  q("skip").onclick = () => save("skip");
}
function msg(t, err) { const m = $("#msg"); if (m) { m.textContent = t; m.className = err ? "err" : ""; } }
async function save(forceAct) {
  const t = VIEW[cur]; if (!t || !form) return;
  const act = forceAct || (form.querySelector("input[name=act]:checked") || {}).value;
  if (!act) { msg("Pick an act (1–8).", true); return; }
  let reply = (form.querySelector("input[name=reply]:checked") || {}).value;
  if (reply === "__other") reply = form.reply_other.value;
  const body = { id: t.id, act, nav: form.nav.value, nav_arg: form.nav_arg.value, cmd: form.cmd.value, place: form.place.value,
    reply: reply === undefined ? null : reply, test: form.test.checked };
  try {
    const r = await api("/api/label", body);
    t.label = r.row; t.start = { ...t.start, act, reply: body.reply ?? t.start.reply, test: body.test, nav: body.nav, nav_arg: body.nav_arg, cmd: body.cmd, place: body.place };
    $("#out").textContent = `saved · real_turns.json: ${r.items_total} items`;
    if (cur < VIEW.length - 1) cur++;
    drawList(); drawDetail();
  } catch (e) { msg(String(e.message || e), true); }
}
function move(n) { cur = Math.max(0, Math.min(VIEW.length - 1, cur + n)); drawList(); drawDetail(); }
document.addEventListener("keydown", e => {
  const inField = e.target.matches("input[type=text], select, textarea");
  if (e.key === "Escape") { e.target.blur && e.target.blur(); return; }
  if (e.key === "Enter" && form && !e.metaKey) { e.preventDefault(); save(); return; }
  if (inField || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "j" || k === "ArrowDown") { e.preventDefault(); move(1); }
  else if (k === "k" || k === "ArrowUp") { e.preventDefault(); move(-1); }
  else if (k === "u") { const i = VIEW.findIndex((t, j) => j > cur && !t.label); if (i >= 0) { cur = i; drawList(); drawDetail(); } }
  else if (/^[1-8]$/.test(k) && form) { const r = form.querySelector(`input[name=act][value="${ACT_KEYS[+k - 1]}"]`); r.checked = true; r.dispatchEvent(new Event("change", { bubbles: true })); }
  else if (k === "a" || k === " ") { const a = document.querySelector("#detail audio:not(.hidden)"); if (a) { e.preventDefault(); a.currentTime = 0; a.play(); } }
  else if (k === "n" && form) { e.preventDefault(); const r = form.querySelector('input[value="navigate"]'); r.checked = true; r.dispatchEvent(new Event("change", { bubbles: true })); form.nav.focus(); }
  else if (k === "o" && form) { e.preventDefault(); const r = form.querySelector('input[value="command"]'); r.checked = true; r.dispatchEvent(new Event("change", { bubbles: true })); form.cmd.focus(); }
  else if (k === "p" && form) { e.preventDefault(); form.place.focus(); }
  else if (k === "r" && form) { const rs = [...form.querySelectorAll("input[name=reply]")].filter(x => x.value !== "__other"); const i = rs.findIndex(x => x.checked); rs[(i + 1) % rs.length].checked = true; }
  else if (k === "q" && form) { const r = form.querySelector('input[name=reply][value=""]'); if (r) r.checked = true; }
  else if (k === "t" && form) { form.test.checked = !form.test.checked; }
  else if (k === "x") { save("skip"); }
});
$("#list").addEventListener("click", e => { const r = e.target.closest(".row"); if (r) { cur = +r.dataset.i; drawList(); drawDetail(); } });
$("#filter").addEventListener("change", () => { cur = 0; drawList(); drawDetail(); });
(async () => {
  try {
    [META, TURNS] = await Promise.all([api("/api/meta"), api("/api/turns")]);
    $("#places").innerHTML = META.places.map(p => `<option value="${esc(p)}">`).join("");
    $("#out").textContent = `labels → ${META.reviewed}`;
    drawList(); drawDetail();
  } catch (e) { $("#stat").textContent = "Couldn't load the turns: " + e.message; }
})();
</script>
</body>
</html>
