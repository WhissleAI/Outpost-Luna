# Outpost Luna desktop: electron-builder config. Inputs come from `make desktop-python desktop-models desktop-arctag`
# (desktop/resources/) plus the NASA media: the Moon map from backend/data/media/img and the trimmed crew clips + their
# time map from backend/data/media/desktop (backend/pipeline/trim_media.py). docs/DESKTOP.md has the full layout.
appId: ai.whissle.outpostluna
productName: Outpost Luna
copyright: Copyright © 2026 Whissle Inc.
directories:
  output: dist
  buildResources: build-resources
files:
  - main/**/*
  - "!main/**/*.test.js"
  - package.json
asar: true
# The Python tree is huge and full of native libraries: ship it as plain files next to the asar.
extraResources:
  - from: resources/python
    to: python
  - from: resources/site
    to: site
  - from: resources/app
    to: app
  - from: resources/models
    to: models
  - from: resources/native
    to: native
  - from: ../backend/data/media/img
    to: app/backend/data/media/img
    filter: ["**/*", "!.DS_Store"]
  - from: ../backend/data/media/desktop
    to: app/backend/data/media
    filter: ["audio/*.mp3", "trim.json"]
compression: normal
afterPack: scripts/sign-resources.js
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.education
  # Default: ad-hoc signature (identity "-"). build-mac.sh with MAC_SIGN_IDENTITY overrides identity and turns
  # hardenedRuntime on; NOTARY_PROFILE adds notarization + stapling (docs/DESKTOP.md "Signing and notarization").
  identity: "-"
  hardenedRuntime: false
  # The Python / model / media trees: scripts/sign-resources.js (afterPack) signs exactly their Mach-O files;
  # osx-sign would otherwise "sign" every model, image and .pyc through xattrs.
  signIgnore:
    - "/Contents/Resources/(python|site|native|app|models)/"
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Outpost Luna listens when you hold the talk button, so you can ask the Moon questions and give mission orders. Everything stays on this computer."
    NSCameraUsageDescription: "Only if you turn on Camera & gestures in Settings: Outpost Luna watches your hand and head so you can control it with gestures. The picture stays on this computer and is never saved or sent."
    LSApplicationCategoryType: public.app-category.education
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned. Authenticode signing: docs/DESKTOP.md.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
publish: null
