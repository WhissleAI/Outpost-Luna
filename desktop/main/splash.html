<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Outpost Luna</title>
<style>
  :root { --bg:#05070d; --fg:#e8ecf5; --dim:#8b93a7; --accent:#7cc4ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-app-region:drag; user-select:none; }
  main { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
  .moon { width:76px; height:76px; border-radius:50%; position:relative;
    background:radial-gradient(circle at 35% 35%, #f2f2ee, #b9b9b2 55%, #6f6f6a); box-shadow:0 0 40px rgba(124,196,255,.25); }
  .moon::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid transparent;
    border-top-color:var(--accent); animation:spin 1.4s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .moon::after { animation:none; border-color:var(--accent); opacity:.4; } }
  h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:.02em; }
  #status { color:var(--dim); font-size:14px; min-height:20px; }
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="moon" aria-hidden="true"></div>
  <h1>Outpost Luna</h1>
  <div id="status">Warming up the models…</div>
</main>
<script>window.setStatus = (t) => { document.getElementById("status").textContent = t; };</script>
</body>
</html>
