<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Outpost Luna</title>
<style>
  /* The app's own font (Inter, as in frontend/src/tokens.css), shipped next to this page: no network. OFL: fonts/Inter-OFL.txt */
  @font-face { font-family:"Inter Variable"; font-style:normal; font-display:swap; font-weight:100 900;
    src:url(fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); }
  :root { --bg:#05070d; --fg:#e8ecf5; --dim:#8b93a7; --accent:#7cc4ff; --bar:#1a2233; --warn:#ffcf7c; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:15px/1.4 "Inter Variable", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; user-select:none; }
  main { height:100%; box-sizing:border-box; padding:28px 36px; display:flex; flex-direction:column; align-items:center; gap:14px; -webkit-app-region:drag; }
  .moon { width:64px; height:64px; border-radius:50%; position:relative; flex:none;
    background:radial-gradient(circle at 35% 35%, #f2f2ee, #b9b9b2 55%, #6f6f6a); box-shadow:0 0 40px rgba(124,196,255,.25); }
  .moon::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid transparent;
    border-top-color:var(--accent); animation:spin 1.4s linear infinite; }
  .idle .moon::after { animation:none; border-color:var(--accent); opacity:.35; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .moon::after { animation:none; border-color:var(--accent); opacity:.4; } }
  h1 { margin:0; font-size:19px; font-weight:700; text-align:center; }
  #msg { color:var(--dim); font-size:14px; min-height:20px; text-align:center; max-width:460px; }
  #msg.warn { color:var(--warn); }
  .total { width:100%; max-width:440px; display:flex; flex-direction:column; gap:6px; }
  .total .head { display:flex; justify-content:space-between; gap:10px; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .total .rate { color:var(--dim); font-size:13px; font-weight:400; font-variant-numeric:tabular-nums; min-height:18px; }
  .total .bar { height:9px; border-radius:5px; background:var(--bar); overflow:hidden; }
  .total .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .3s; }
  .once { color:var(--dim); font-size:13px; text-align:center; margin:0; }
  ul { list-style:none; margin:0; padding:0; width:100%; max-width:440px; display:flex; flex-direction:column; gap:8px; }
  li { display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:13px; }
  li .bar { grid-column:1 / 3; height:5px; border-radius:3px; background:var(--bar); overflow:hidden; }
  li .bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  li .n { color:var(--dim); font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; -webkit-app-region:no-drag; }
  button { font:inherit; font-size:14px; padding:7px 14px; border-radius:8px; border:1px solid #2c3850; background:#121a2a; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#05101f; border-color:var(--accent); font-weight:600; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main id="root" role="status" aria-live="polite">
  <div class="moon" aria-hidden="true"></div>
  <h1 id="title">Getting Outpost Luna ready</h1>
  <div id="msg">Downloading the Moon…</div>
  <div class="total" id="total" aria-live="off" hidden>
    <div class="head"><span id="totalTop"></span><span class="rate" id="totalRate"></span></div>
    <div class="bar" role="progressbar" aria-label="Download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="totalBar"><i id="totalFill"></i></div>
  </div>
  <p class="once">One time only. After this, Outpost Luna runs fully offline.</p>
  <ul id="list"></ul>
  <div class="row">
    <button id="retry" class="primary" hidden>Try again</button>
    <button id="import">Import offline pack…</button>
    <button id="later">Continue later</button>
  </div>
</main>
<script src="firstrun_progress.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const P = window.FirstRunProgress;
  const mb = (b) => P.bytes(b);
  const rate = P.createRate();
  let last = null;
  const paintTotal = (assets) => {
    const sum = P.summarize(assets);
    $("total").hidden = !sum.total;
    if (!sum.total) return;
    if (last && last.busy) rate.add(Date.now(), sum.done); else rate.reset();
    const l = P.lines(sum, rate.speed());
    $("totalTop").textContent = l.top;
    $("totalRate").textContent = last && last.busy ? l.rate : "";
    $("totalFill").style.width = sum.pct + "%";
    $("totalBar").setAttribute("aria-valuenow", String(sum.pct));
  };
  $("retry").onclick = () => window.firstrun.retry();
  $("later").onclick = () => window.firstrun.later();
  $("import").onclick = () => window.firstrun.importPack();
  window.firstrun.onState((s) => {
    last = s;
    paintTotal(s.assets || []);
    $("title").textContent = s.title || "Getting Outpost Luna ready";
    $("msg").textContent = s.message || "";
    $("msg").className = s.problem ? "warn" : "";
    $("root").className = s.busy ? "" : "idle";
    $("retry").hidden = !s.problem;
    $("import").disabled = !!s.busy;
    $("list").replaceChildren(...(s.assets || []).map((a) => {
      const li = document.createElement("li");
      const pct = a.state === "installed" ? 100 : Math.min(100, Math.round(100 * (a.done || 0) / (a.size || 1)));
      li.innerHTML = '<span class="t"></span><span class="n"></span><span class="bar"><i></i></span>';
      li.querySelector(".t").textContent = a.title;
      li.querySelector(".n").textContent = a.state === "installed" ? "ready" : `${mb(a.done || 0)} / ${mb(a.size)}`;
      li.querySelector("i").style.width = pct + "%";
      return li;
    }));
  });
</script>
</body>
</html>
