[project]
name = "moon-backend"
version = "0.1.0"
description = "Ask the Moon backend: places, crew moments, and the turn resolver (start of the Director)."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic-settings==2.6.1",
  "httpx==0.28.1",
  "rapidfuzz==3.10.1",
  "websockets==17.4",
  "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["voice_pack: run with the recorded voice pack on (tests/conftest.py no_voice_pack)"]
