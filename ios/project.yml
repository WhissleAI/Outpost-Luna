# XcodeGen spec for the iPad app (docs/IPAD.md). The generated OutpostLuna.xcodeproj is committed, so building needs
# only Xcode; regenerate with `xcodegen generate` (in ios/) after changing this file.
name: OutpostLuna
options:
  bundleIdPrefix: ai.whissle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XXK95K57U5
    CODE_SIGN_STYLE: Automatic
targets:
  OutpostLuna:
    type: application
    platform: iOS
    scheme:
      testTargets: [OutpostLunaUITests]
    sources:
      - path: OutpostLuna
        excludes: ["Info.plist"]
      - path: ../desktop/main/splash.html
        buildPhase: resources
      - path: build/stage/app
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - framework: build/Python.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.whissle.outpostluna
        PRODUCT_NAME: Outpost Luna
        INFOPLIST_FILE: OutpostLuna/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: OutpostLuna/OutpostLuna-Bridging-Header.h
        HEADER_SEARCH_PATHS: "\"$(BUILT_PRODUCTS_DIR)/Python.framework/Headers\""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64   # Apple-silicon simulators only (the Python install step is per-arch)
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    postCompileScripts: []
    postBuildScripts:
      - name: Install Python
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # site-packages for this SDK (ios/scripts/build_python.sh), then every .so becomes a framework
          rsync -a --delete "$PROJECT_DIR/build/stage/app_packages.$PLATFORM_NAME/" "$CODESIGNING_FOLDER_PATH/app_packages/"
          # unsigned builds (CODE_SIGNING_ALLOWED=NO: size checks, CI) still sign the module frameworks ad hoc
          [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] || export EXPANDED_CODE_SIGN_IDENTITY=-
          source "$PROJECT_DIR/build/Python.xcframework/build/utils.sh"
          install_python build/Python.xcframework app_packages
  OutpostLunaUITests:
    # Touch walkthrough on the simulator (docs/IPAD.md): first launch + call sign, a Flight School lesson, a Mission
    # shift. Screenshots go to $LUNA_SHOTS (xcodebuild test ... TEST_RUNNER_LUNA_SHOTS=<dir>).
    type: bundle.ui-testing
    platform: iOS
    sources: [OutpostLunaUITests]
    dependencies:
      - target: OutpostLuna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.whissle.outpostluna.uitests
        TEST_TARGET_NAME: OutpostLuna
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
