[project]
name = "moon-model-server"
version = "0.1.0"
description = "Hosts Whissle models (Arc Transcriber Space ear via libarc, Arc Tagger, embeddings) and the OS voice behind one HTTP API."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic-settings==2.6.1",
  "numpy==1.26.4",
  "soundfile>=0.14.0",
  "psutil>=7.2.2",
  "python-multipart>=0.0.33",
  "scipy>=1.17.1",
  # ONE ONNX Runtime version for the whole app: desktop/vendor/libarc/onnxruntime.lock.json pins the C runtime libarc
  # loads (vendored next to it at build time); this wheel (the embedder, Steer TTS) must be the same version
  # (tests/test_bindings.py checks). Change both together.
  "onnxruntime==1.32.0",
  # The generated C bindings (app/_arc_ffi.py, app/_arctag_ffi.py; tools/gen_bindings.py): cffi out-of-line ABI mode.
  # The generated code depends on the cffi version: regenerate when it moves.
  "cffi==2.1.1",
  "tokenizers>=0.23.3",
  # Steer TTS Edge, the optional second voice engine (app/tts_steer.py): pure Python + ONNX Runtime + numpy +
  # safetensors (py3-none-any), so the same wheel runs on macOS and Windows. Vendored (CC BY-NC 4.0, NOTICE inside).
  "steertts-edge",
  # Windows speech (app/tts_os.py): WinRT Windows.Media.SpeechSynthesis (OneCore voices, real word timings), SAPI 5
  # through comtypes as the fallback. macOS uses /usr/bin/say: nothing to install.
  "winrt-runtime==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.SpeechSynthesis==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Media.Core==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "comtypes==1.4.17; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
steertts-edge = { path = "../desktop/vendor/wheels/steertts_edge-1.3.0-py3-none-any.whl" }

