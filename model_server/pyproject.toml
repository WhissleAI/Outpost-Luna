[project]
name = "moon-model-server"
version = "0.1.0"
description = "Hosts Whissle models (Arc Tagger now; Arc audio metadata and embeddings next) behind one HTTP API."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic-settings==2.6.1",
  "torch==2.11.0",
  "transformers==5.19.0",
  "numpy==1.26.4",
  "soundfile>=0.14.0",
  "psutil>=7.2.2",
  "python-multipart>=0.0.33",
  "arc-transcriber",
  "scipy>=1.17.1",
  "steertts-edge",
]

[dependency-groups]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
arc-transcriber = { path = "../../../../../../dv3work/arc/arc_transcriber", editable = true }
steertts-edge = { path = "../../steer-tts/edge", editable = true }
